name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    # Fork release: no SignPath or Apple notarization credentials exist in this repo,
    # so both signing gates stay off and only the platforms this fork uses are built.
    # Toggling platform flags here is safe: the release job derives checksums from
    # whatever artifacts were actually produced.
    uses: ./.github/workflows/build-core.yml
    with:
      run_tests: true
      build_macos_arm64: false
      build_macos_amd64: false
      build_windows_amd64: true
      build_linux_amd64: false
      require_macos_notarize: false
      require_windows_signpath: false
      artifact_retention_days: 10
    secrets: inherit

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Keep checkout on a Node 24-compatible major so release jobs do not depend on deprecated Node 20 action runtimes.
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          # Extract changelog for current version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk -v version="$VERSION" '
            index($0, "## v" version " ") == 1 {
              in_changelog = 1
              next
            }
            in_changelog && /^## v[0-9]/ {
              exit
            }
            in_changelog && $0 == "---" {
              exit
            }
            in_changelog {
              print
            }
          ' CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Checksums cover every artifact this run produced, so enabling or disabling
      # platforms above can never make this step fail on a missing file.
      - name: Compute checksums (MD5)
        run: |
          set -euo pipefail
          cd release-files
          md5sum * > checksums.md5
          cat checksums.md5

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-files/*"
          tag: ${{ github.ref_name }}
          name: "Wox ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
